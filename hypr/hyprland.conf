############
### ENVS ###
############

# --- GTK ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORMTHEME,xdgdesktopportal

# --- Wayland ---
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Scale ---
env = GDK_SCALE,1 
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_ENABLE_HIGHDPI_SCALING,1

# --- Theme ---
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- Toolkit Backends ---
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

################
### MONITORS ###
################
monitor=eDP-1, 3840x2400@60, auto, 2.5

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = nautilus

#################
### AUTOSTART ###
#################
exec-once = swaybg -i /home/afterall/.cache/wallpaper -m fill
exec-once = hyprlock & hypridle & hyprpanel & hyprland-per-window-layout & mullvad-vpn & clipse -listen
exec-once = gsettings set org.gnome.desktop.interface decoration-layout :
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 16
    gaps_out = 16
    border_size = 0
    layout = monocle
}

decoration {
    rounding = 12
}
 
animations {
    enabled = true
    
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor, 1, 7, quick
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
    disable_splash_rendering = true
    always_follow_on_dnd = true
    background_color = 0x000000
}

#############
### INPUT ###
#############
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

bind = SUPER, Q, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = CTRL SHIFT, Escape, exec, missioncenter
bind = SUPER, D, exec, discord --password-store=basic
bind = SUPER, B, exec, brave --password-store=basic
bind = SUPER SHIFT, B, exec, mullvad-exclude brave --password-store=basic
bind = SUPER, C, exec, code --password-store=basic
bind = SUPER, T, exec, Telegram
bind = SUPER, M, exec, mullvad-vpn
bind = SUPER, S, exec, mullvad-exclude spotify --force-device-scale-factor=2.5
bind = SUPER, G, exec, env GDK_SCALE=2 env GDK_DPI_SCALE=1.25 mullvad-exclude steam
bind = SUPER, V, exec, $terminal --class clipse -e clipse

bind = SUPER, K, killactive
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = , Print, exec, grimblast --freeze copy area
bind = SHIFT, Print, exec, grimblast --freeze save area - | satty --filename - --early-exit --copy-command "wl-copy"
bind = ALT, Print, exec, grimblast copy screen
bind = CTRL, Print, exec, grimblast copy active
bind = SUPER ALT, R, exec, ~/.config/scripts/screenrec.sh

bind = SUPER SHIFT, E, exit
bind = SUPER SHIFT, P, exec, systemctl poweroff
bind = SUPER SHIFT, R, exec, systemctl reboot
bind = SUPER SHIFT, L, exec, hyprctl switchxkblayout at-translated-set-2-keyboard 0 && loginctl lock-session

bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

####################
### WINDOW RULES ###
####################

windowrule {
    name = float
    match:class = .*
    float = on
    max_size = 1504 874
}

windowrule {
    name = max
    match:class = ^(brave-browser|code|code-url-handler|discord|steam)$
    size = 1504 874
}

windowrule {
    name = games
    match:class = ^(steam_app_.*|gamescope)$
    fullscreen = on
}

windowrule {
    name = tg
    match:class = ^(org\.telegram\.desktop|telegram-desktop)$
    size = 1250 600
}

windowrule {
    name = halfmax
    match:class = ^([Ss]potify|discord)$
    center = on
    size = 1504 750
}

windowrule {
    name = clipse
    match:class = ^(clipse)$
    opacity = 0.85
    size = 700 650
}

windowrule {
    name = kitty
    match:class = ^(kitty)$
    opacity = 0.85
    size = 920 650
}

xwayland {
    force_zero_scaling = true
}
